<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dynamic Weather Hub</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
  <style>
    body {
      background: linear-gradient(135deg, #f3f4fa, #d4e6ff);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      transition: background 1s ease;
    }
    body.sunny { background: linear-gradient(135deg, #ffe066, #ffcc00); }
    body.cloudy { background: linear-gradient(135deg, #b3b3b3, #d9d9d9); }
    body.rainy { background: linear-gradient(135deg, #4d79ff, #0033cc); }
    body.snowy { background: linear-gradient(135deg, #e6f7ff, #b3d9ff); }
    body.thunder { background: linear-gradient(135deg, #4d4d4d, #1a1a1a); }
    #container {
      margin: 30px 0;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      box-shadow: 0 4px 30px rgba(0,0,0,0.09), 0 1.5px 8px rgba(0,0,0,0.025);
      padding: 36px 30px 30px 30px;
      max-width: 520px;
      width: 100%;
      overflow: hidden;
      animation: fadeIn 1s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(50px); }
      to { opacity: 1; transform: translateY(0); }
    }
    #search-bar {
      width: 100%;
      display: flex;
      justify-content: center;
      padding-bottom: 16px;
      border-bottom: 1px solid #eee;
      margin-bottom: 24px;
      align-items: center;
    }
    #city {
      width: 250px;
      font-size: 18px;
      padding: 12px 14px;
      border-radius: 18px 0 0 18px;
      border: 1.5px solid #dadada;
      background: #fff;
      color: #111;
      outline: none;
      box-shadow: none;
      transition: border 0.3s;
    }
    #city:focus { border-color: #db4fff; }
    #search-btn {
      border-radius: 0 18px 18px 0;
      padding: 12px 22px;
      font-size: 17px;
      background: #db4fff;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.3s, transform 0.2s;
    }
    #search-btn:hover {
      background: #ae36b3;
      transform: scale(1.05);
    }
    #now {
      display: flex;
      align-items: center;
      margin-bottom: 6px;
      gap: 22px;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.7s cubic-bezier(0.66,0.04,0.44,0.99), transform 0.6s;
    }
    #now.visible {
      opacity: 1;
      transform: translateY(0);
    }
    #main-icon {
      width: 95px;
      height: 95px;
      animation: pop 1.5s infinite cubic-bezier(0.68, -0.55, 0.27, 1.55) alternate;
      filter: drop-shadow(0 3px 18px #e0d4ffac);
      transition: transform 0.5s;
    }
    #main-icon:hover { transform: scale(1.1); }
    @keyframes pop {
      0% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-6px) scale(1.08); }
      100% { transform: translateY(0) scale(1); }
    }
    #main-desc {
      color: #583bb6;
      font-size: 22px;
      text-transform: capitalize;
    }
    #main-temp {
      font-size: 54px;
      font-weight: 600;
      color: #2b2954;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }
    #daydate {
      color: #8e89a7;
      font-size: 15px;
      margin-bottom: 5px;
      font-weight: 500;
    }
    #details {
      display: flex;
      justify-content: center;
      gap: 26px;
      margin: 12px 0 24px 0;
      font-size: 16px;
      color: #333;
      opacity: 0;
      transform: translateY(12px);
      transition: 0.55s;
      flex-wrap: wrap;
    }
    #details.visible { opacity:1; transform:translateY(0); }
    #advice {
      margin-top: 12px;
      margin-bottom: 22px;
      padding: 10px 18px;
      background: #e3fed4;
      color: #256d2c;
      border-radius: 13px;
      font-size: 17px;
      font-weight: 500;
      box-shadow: 0 2px 17px rgba(53,150,17,0.06);
      display: none;
      transition: 0.35s;
      animation: adviceanim 1.6s infinite cubic-bezier(0.47,1.64,0.41,-0.2) alternate;
    }
    @keyframes adviceanim {
      0%,67%{box-shadow:0 2px 17px #cef8c4;}
      100%{box-shadow:0 8px 27px #8edd99;}
    }
    #air-quality {
      margin: 12px 0;
      padding: 10px;
      background: #f0faff;
      border-radius: 13px;
      font-size: 16px;
      color: #333;
      display: none;
      animation: fadeIn 1s;
    }
    #air-quality.good { background: #d4ffe0; color: #008000; }
    #air-quality.moderate { background: #fffacd; color: #ffa500; }
    #air-quality.poor { background: #ffdab9; color: #ff4500; }
    #air-quality.unhealthy { background: #ffb6c1; color: #c71585; }
    #air-quality.visible { display: block; }
    #hourly-section {
      margin-bottom: 18px;
      opacity: 0;
      transition: opacity 0.7s 0.2s cubic-bezier(0.66,0.04,0.44,0.99);
    }
    #hourly-section.visible { opacity:1; }
    #hourly-title {
      font-weight: 600;
      color: #222;
      font-size: 17px;
      margin-bottom: 4px;
      text-align: left;
    }
    #hourly-chart {
      background: #fafaff;
      padding: 8px 5px 0 5px;
      border-radius: 17px;
      animation: chartAnim 1s ease-in-out;
    }
    @keyframes chartAnim {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    #forecast {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
      opacity:0;
      transition:0.55s;
    }
    #forecast.visible{opacity:1;}
    .forecast-day {
      background: #f3f3fa;
      border-radius: 12px;
      padding: 12px 10px 7px 10px;
      min-width: 74px;
      text-align: center;
      flex: 0 0 auto;
      color: #383838;
      transition: box-shadow 0.18s, transform 0.3s;
      box-shadow: 0 2px 8px rgba(80,72,255,0.03);
      opacity:0;
      transform:translateY(15px) scale(0.98);
      transition:0.32s;
      cursor: pointer;
    }
    .forecast-day.visible{transform:translateY(0) scale(1); opacity:1;}
    .forecast-day:hover { transform: scale(1.05); }
    .forecast-day .icon-bg {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      margin: 0 auto 3px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ebebfa;
      transition: background 0.3s;
    }
    .forecast-day.sun .icon-bg { background: #fff6cf; }
    .forecast-day.rain .icon-bg { background: #d2eafb; }
    .forecast-day.cloud .icon-bg { background: #ebebfa; }
    .forecast-day.thunder .icon-bg { background: #ffe8ef;}
    .forecast-day.snow .icon-bg { background: #e5f9ff; }
    .forecast-day.active { box-shadow: 0 4px 10px rgba(219,79,255,0.10);}
    .forecast-day .fday { font-weight: 500; margin-top: 3px; margin-bottom: 2px;}
    .forecast-day .ftemp { margin-top: 2px;}
    .forecast-day .fdate { color: #8e89a7; font-size:13px;}
    .warning {
      margin-top: 16px;
      background: #ffeaea;
      color: #c92d2d;
      padding: 10px;
      border-radius: 9px;
      font-size: 16px;
      font-weight: 600;
      box-shadow: 0 2px 10px rgba(220,10,10,0.03);
      display: none;
      animation: adviceanim 2.5s infinite alternate;
    }
    .error-message {
      color: #c40000;
      margin: 14px 0;
      font-weight: 500;
      background: #fff1f1;
      border-radius: 7px;
      padding: 6px 0;
    }
    #selected-day {
      margin-top: 20px;
      padding: 15px;
      background: #f9f9ff;
      border-radius: 15px;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.5s, transform 0.5s;
      display: none;
    }
    #selected-day.visible {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }
    .selected-now {
      display: flex;
      align-items: center;
      gap: 22px;
      margin-bottom: 10px;
    }
    .selected-icon {
      width: 70px;
      height: 70px;
    }
    .selected-temp {
      font-size: 36px;
      font-weight: 600;
      color: #2b2954;
    }
    .selected-desc {
      color: #583bb6;
      font-size: 18px;
      text-transform: capitalize;
    }
    .selected-details {
      display: flex;
      justify-content: center;
      gap: 20px;
      font-size: 14px;
      color: #333;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div id="container">
    <form id="search-bar" onsubmit="event.preventDefault();fetchStart();">
      <input type="text" id="city" placeholder="Enter City (e.g. Vellore)">
      <button id="search-btn" type="submit">Search</button>
    </form>
    <div id="error" class="error-message"></div>
    <div id="daydate"></div>
    <div id="now">
      <img id="main-icon" style="display:none;">
      <div>
        <div id="main-temp"></div>
        <div id="main-desc"></div>
      </div>
    </div>
    <div id="details"></div>
    <div id="air-quality"></div>
    <div id="advice"></div>
    <div id="hourly-section">
      <div id="hourly-title">Next 8 hours</div>
      <div id="hourly-chart">
        <canvas id="chart"></canvas>
      </div>
    </div>
    <div id="forecast"></div>
    <div id="selected-day"></div>
    <div id="warning" class="warning" style="display:none;"></div>
  </div>
  <script>
    const weatherCodes = {
      0:  { icon: "01d", desc: "Clear sky", cls:"sun" },
      1:  { icon: "02d", desc: "Mainly clear", cls:"sun" },
      2:  { icon: "03d", desc: "Partly cloudy",cls:"cloud" },
      3:  { icon: "04d", desc: "Overcast", cls:"cloud" },
      45: { icon: "50d", desc: "Fog", cls:"cloud" },
      51: { icon: "09d", desc: "Light drizzle",cls:"rain"  },
      53: { icon: "09d", desc: "Moderate drizzle",cls:"rain"},
      55: { icon: "09d", desc: "Dense drizzle",cls:"rain"  },
      61: { icon: "10d", desc: "Light rain", cls:"rain"  },
      63: { icon: "10d", desc: "Moderate rain",cls:"rain"  },
      65: { icon: "10d", desc: "Heavy rain", cls:"rain"  },
      71: { icon: "13d", desc: "Light snow", cls:"snow"  },
      73: { icon: "13d", desc: "Moderate snow",cls:"snow"  },
      75: { icon: "13d", desc: "Heavy snow", cls:"snow"  },
      80: { icon: "09d", desc: "Light showers",cls:"rain"  },
      81: { icon: "09d", desc: "Moderate showers",cls:"rain"},
      82: { icon: "09d", desc: "Heavy showers",cls:"rain"  },
      95: { icon: "11d", desc: "Thunderstorm", cls:"thunder"},
      96: { icon: "11d", desc: "Thunderstorm w/ hail",cls:"thunder"},
      99: { icon: "11d", desc: "Thunderstorm w/ heavy hail",cls:"thunder"}
    };
    function getInfo(code) { return weatherCodes[code] || {icon:"01d",desc:"Unknown",cls:"cloud"}; }
    function getWindDirection(deg) {
      const d = ['N','NE','E','SE','S','SW','W','NW','N'];
      return d[Math.round(deg/45)%8];
    }
    function getAdvice(code, temp, humid, aqi) {
      if([51,53,55,61,63,65,80,81,82].includes(code))   return "Grab an umbrella!";
      if([71,73,75].includes(code))                     return "Dress warmly and drive carefully—it's snowy!";
      if([95,96,99].includes(code))                     return "Thunderstorm risk: best to stay indoors!";
      if(code <= 3 && temp >= 38)                       return "Stay hydrated and avoid heat!";
      if(code === 0 && temp >= 32)                      return "Wear sunscreen, it's hot and sunny!";
      if(humid > 85 && code <= 3)                       return "It feels muggy outside, dress cool!";
      if(aqi > 100)                                     return "Air quality is poor—limit outdoor activities!";
      return "";
    }
    function getAqiClass(aqi) {
      if (aqi <= 50) return "good";
      if (aqi <= 100) return "moderate";
      if (aqi <= 150) return "poor";
      return "unhealthy";
    }
    function setBackgroundClass(cls) {
      document.body.className = '';
      document.body.classList.add(cls === 'sun' ? 'sunny' : cls === 'cloud' ? 'cloudy' : cls === 'rain' ? 'rainy' : cls === 'snow' ? 'snowy' : 'thunder');
    }
    async function fetchStart() {
      const city = document.getElementById("city").value.trim();
      if (!city) { showError("Please enter a city."); return; }
      clearError();
      const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`;
      try {
        const geo = await fetch(geoUrl).then(r=>r.json());
        if (!geo.results || geo.results.length==0) return showError("City not found.");
        const { latitude, longitude, name, country } = geo.results[0];
        displayWeatherCard(latitude,longitude,name+', '+(country||""));
      } catch (e) { showError("Cannot get location."); }
    }
    let globalWeatherData;
    async function displayWeatherCard(lat, lon, location) {
      const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,precipitation,wind_speed_10m,wind_direction_10m,visibility,uv_index&hourly=temperature_2m,precipitation,weather_code,relative_humidity_2m,wind_speed_10m&daily=temperature_2m_min,temperature_2m_max,precipitation_sum,weather_code,uv_index_max&timezone=auto`;
      const aqiUrl = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=european_aqi,pm10,pm2_5`;
      try {
        const [weatherData, aqiData] = await Promise.all([
          fetch(weatherUrl).then(r=>r.json()),
          fetch(aqiUrl).then(r=>r.json())
        ]);
        globalWeatherData = weatherData;
        const now = weatherData.current;
        const curinfo = getInfo(now.weather_code);
        setBackgroundClass(curinfo.cls);
        // --- Date and Day ---
        const dateNow = new Date(weatherData.current.time);
        document.getElementById('daydate').innerHTML = dateNow.toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric', year:'numeric'}) + " - " + dateNow.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
        // --- Now Weather Animation ---
        document.getElementById('main-icon').src = `https://openweathermap.org/img/wn/${curinfo.icon}@2x.png`;
        document.getElementById('main-icon').alt = curinfo.desc;
        document.getElementById('main-icon').style.display = 'inline-block';
        document.getElementById('main-temp').innerHTML = `${now.temperature_2m.toFixed(1)}<span style="font-size:28px;vertical-align:text-top">°C</span>`;
        document.getElementById('main-desc').innerText = `${location} — ${curinfo.desc}`;
        document.getElementById('now').classList.add("visible");
        setTimeout(()=>document.getElementById("details").classList.add("visible"),300);
        document.getElementById('details').innerHTML = `
          <span>Feels Like: ${now.apparent_temperature.toFixed(1)}°C</span>
          <span>Humidity: ${now.relative_humidity_2m}%</span>
          <span>Precipitation: ${now.precipitation.toFixed(1)}mm</span>
          <span>Wind: ${now.wind_speed_10m.toFixed(0)} km/h ${getWindDirection(now.wind_direction_10m)}</span>
          <span>Visibility: ${(now.visibility / 1000).toFixed(1)} km</span>
          <span>UV Index: ${now.uv_index.toFixed(1)}</span>
        `;
        // --- Air Quality ---
        const aqi = aqiData.current.european_aqi;
        const airQualityDiv = document.getElementById('air-quality');
        airQualityDiv.innerHTML = `Air Quality Index: ${aqi} (PM2.5: ${aqiData.current.pm2_5.toFixed(1)} µg/m³, PM10: ${aqiData.current.pm10.toFixed(1)} µg/m³)`;
        airQualityDiv.className = `visible ${getAqiClass(aqi)}`;
        // --- Advice ---
        let tip=getAdvice(now.weather_code,now.temperature_2m,now.relative_humidity_2m, aqi);
        const adviceDiv=document.getElementById('advice');
        if(tip){ adviceDiv.innerText=tip; adviceDiv.style.display="block"; }
        else{ adviceDiv.style.display="none"; }
        // --- Hourly Chart ---
        const chartL = [];
        const chartT = [];
        const chartP = [];
        for (let i=0; i<8; ++i) {
          chartL.push(new Date(weatherData.hourly.time[i]).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}));
          chartT.push(weatherData.hourly.temperature_2m[i].toFixed(1));
          chartP.push(weatherData.hourly.precipitation[i]);
        }
        if (window.weatherChart) { window.weatherChart.destroy(); }
        const ctx = document.getElementById('chart').getContext('2d');
        setTimeout(()=>document.getElementById("hourly-section").classList.add("visible"),320);
        window.weatherChart = new Chart(ctx, {
          type: 'line',
          data: {
            labels: chartL,
            datasets:[
              {
                label: "Temperature (°C)",
                data: chartT,
                borderColor: "#db4fff",
                backgroundColor: 'rgba(219,79,255,0.12)',
                fill: true,
                yAxisID: "yT",
                tension: .47
              },
              {
                label:"Precipitation (mm)",
                data: chartP,
                borderColor:"#49b2fc",
                backgroundColor:"rgba(73,178,252,0.13)",
                type:"bar",
                yAxisID: "yP",
                borderWidth:1,
                order: 0
              }
            ]
          },
          options: {
            animation:{duration:1400,easing:'easeOutElastic'},
            responsive:true,
            plugins: { legend:{labels:{color:'#433a66'}} },
            scales: {
              yT: { position:'left',title:{display:true,text:"°C"},ticks:{color:'#db4fff'}, beginAtZero: false },
              yP: { position:'right',title:{display:true,text:"mm",color:'#49b2fc'},grid:{display:false},ticks:{color:'#49b2fc'}, beginAtZero:true }
            }
          }
        });
        // --- Daily Forecast with Animation, Day, Date, UV ---
        let fDom = '';
        for (let i=0; i<7; ++i) {
          const code=weatherData.daily.weather_code[i],inf=getInfo(code);
          let fcls='forecast-day '+inf.cls+(i==0?' active':'');
          const d = new Date(weatherData.daily.time[i]);
          fDom += `<div class="${fcls}" data-day-index="${i}">
              <div class="icon-bg"><img src="https://openweathermap.org/img/wn/${inf.icon}.png" alt="${inf.desc}"></div>
              <div class="fday">${d.toLocaleDateString(undefined,{weekday:"short"})}</div>
              <div class="fdate">${d.toLocaleDateString(undefined,{day:'numeric',month:'short'})}</div>
              <div class="ftemp"><b>${weatherData.daily.temperature_2m_max[i].toFixed(1)}°</b> <span style="color:#888">${weatherData.daily.temperature_2m_min[i].toFixed(1)}°</span></div>
              <div style="font-size:13px">${inf.desc.split(' ')[0]} | UV: ${weatherData.daily.uv_index_max[i].toFixed(1)}</div>
            </div>`;
        }
        document.getElementById('forecast').innerHTML = fDom;
        document.getElementById('forecast').classList.add("visible");
        setTimeout(()=>{
          document.querySelectorAll('.forecast-day').forEach((el,i) => setTimeout(()=>el.classList.add("visible"),50*i));
        },280);

        // Add click event listeners to forecast days
        document.querySelectorAll('.forecast-day').forEach(day => {
          day.addEventListener('click', (e) => {
            document.querySelectorAll('.forecast-day').forEach(d => d.classList.remove('active'));
            e.currentTarget.classList.add('active');
            const index = parseInt(e.currentTarget.getAttribute('data-day-index'));
            showDailyDetails(index, location);
          });
        });

        // --- Weather Warnings ---
        const warn = document.getElementById("warning");
        warn.style.display = "none";
        if (Math.max(...weatherData.daily.temperature_2m_max)>=38)
          {warn.innerHTML = "⚠️ <b>Severe Heat Warning</b>: High temperatures expected this week."; warn.style.display="block";}
        else if ((Math.max(...weatherData.daily.precipitation_sum))>=25)
          {warn.innerHTML = "🌧️ <b>Rain Alert</b>: Significant rainfall forecast this week."; warn.style.display="block";}
        else if (now.temperature_2m>=36)
          {warn.innerHTML = "🔥 <b>Excessive heat right now!</b> Stay hydrated."; warn.style.display="block";}
        else if (aqi > 150)
          {warn.innerHTML = "🚨 <b>Air Quality Alert</b>: Unhealthy air—avoid outdoor exertion."; warn.style.display="block";}

        setTimeout(()=>{document.getElementById('chart').parentElement.parentElement.scrollIntoView({behavior:'smooth'})}, 350);
      } catch(e) { showError("Failed to get weather."); }
    }

    function showDailyDetails(index, location) {
      const dayData = globalWeatherData.daily;
      const code = dayData.weather_code[index];
      const inf = getInfo(code);
      const d = new Date(dayData.time[index]);
      const selectedDayDiv = document.getElementById('selected-day');
      selectedDayDiv.innerHTML = `
        <div class="selected-now">
          <img class="selected-icon" src="https://openweathermap.org/img/wn/${inf.icon}@2x.png" alt="${inf.desc}">
          <div>
            <div class="selected-temp">${dayData.temperature_2m_max[index].toFixed(1)}°C / ${dayData.temperature_2m_min[index].toFixed(1)}°C</div>
            <div class="selected-desc">${location} — ${inf.desc} on ${d.toLocaleDateString(undefined, {weekday: 'long', month: 'long', day: 'numeric'})}</div>
          </div>
        </div>
        <div class="selected-details">
          <span>Precipitation: ${dayData.precipitation_sum[index].toFixed(1)} mm</span>
          <span>UV Index Max: ${dayData.uv_index_max[index].toFixed(1)}</span>
        </div>
      `;
      selectedDayDiv.classList.add('visible');
      selectedDayDiv.scrollIntoView({behavior: 'smooth'});
      setBackgroundClass(inf.cls);
    }
    function showError(msg) { document.getElementById("error").innerText = msg; }
    function clearError() { document.getElementById("error").innerText = ""; }
  </script>
</body>
</html>
